name: Build RetroBit Launcher APK

on:
  push:
    branches: [ main, master, "arena/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan build manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Proyek tidak menyertakan gradle-wrapper.jar, jadi gunakan Gradle resmi
      # versi yang sama dengan gradle-wrapper.properties (8.7).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK with Gradle
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-output.log

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          retention-days: 14

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RetroBit-Launcher-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
